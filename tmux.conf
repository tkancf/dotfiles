## Plugins

# prefi xkey
set -g prefix C-Space
set -g assume-paste-time 0
set-option -sg escape-time 10
set-option -g history-limit 1000000
set-option -g mouse on
set-option -g focus-events on

# window-status color
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:pane_current_path}'

# Sync tmux panes
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# set default shell
# /opt/homebrew/bin/fish
# /bin/zsh
set-option -g default-shell "/opt/homebrew/bin/fish"


## 256 color
set-option -g  default-terminal "xterm-256color"
set-option -ga terminal-overrides ",$TERM:Tc"
# set-option -g default-terminal screen-256color

# allow-passthrough=on
set-option -g allow-passthrough on

# reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# session-specific status colors
# session colors: #B1E8A5=yellow-green, #005FFF=blue, #FF4444=red, #FF8700=orange, #00AFFF=cyan, #8700FF=purple
set -g @session_color_list "#00AFFF #FF4444 #FF8700 #8700FF"
set -g @session_color_fg "#FFFFFF"
set-hook -g session-created 'run-shell -b "~/.config/dotfiles/config/tmux/session-color.sh #{session_name}"'
set-hook -g session-renamed 'run-shell -b "~/.config/dotfiles/config/tmux/session-color.sh #{session_name}"'
set-hook -g client-session-changed 'run-shell -b "~/.config/dotfiles/config/tmux/session-color.sh"'
run-shell -b 'tmux list-sessions -F "#{session_name}" | while read -r s; do ~/.config/dotfiles/config/tmux/session-color.sh "$s"; done'

## vi key bind
setw -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
set -s copy-command 'pbcopy'

# change key bind vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# session navigation
bind ] switch-client -n
bind [ switch-client -p

# resize-pane vim key bind
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# open pane current path
bind % split-window -hc "#{pane_current_path}"
bind "'" split-window -vc "#{pane_current_path}"

bind C new-session
